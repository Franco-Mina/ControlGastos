<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };

    (() => {
      try {
        const stored = localStorage.getItem("theme");
        const isDark = stored ? stored === "dark" : true;
        document.documentElement.classList.toggle("dark", isDark);
      } catch {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style type="text/tailwindcss">
    .card {
      @apply rounded-2xl border border-slate-200 bg-white shadow-sm
             dark:border-slate-800 dark:bg-slate-900 dark:shadow-black/20;
    }
    /* Tinted cards must come after .card so their background wins. */
    .card-success {
      @apply border-emerald-200 bg-emerald-50 dark:border-emerald-900 dark:bg-emerald-950;
    }
    .card-danger {
      @apply border-rose-200 bg-rose-50 dark:border-rose-900 dark:bg-rose-950;
    }
    .field {
      @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 shadow-sm outline-none transition
             placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100
             dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-500
             dark:focus:border-indigo-400 dark:focus:ring-indigo-900/60;
    }
    .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition; }
    .btn-primary {
      @apply bg-indigo-600 text-white shadow-sm hover:bg-indigo-500
             dark:bg-indigo-500 dark:hover:bg-indigo-400;
    }
    .btn-secondary {
      @apply border border-slate-300 bg-white text-slate-700 shadow-sm hover:bg-slate-50
             dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body class="min-h-full font-sans text-slate-800 antialiased dark:text-slate-200">
  <div class="flex min-h-screen flex-col">
    <header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
      <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
        <a href="/" class="flex items-center gap-2 font-semibold tracking-tight text-slate-900 dark:text-slate-100">
          <span class="grid h-8 w-8 place-items-center rounded-lg bg-indigo-600 text-white dark:bg-indigo-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 12h.01" />
            </svg>
          </span>
          {{ app_name }}
        </a>
        <nav class="flex flex-wrap items-center gap-1 text-sm font-medium">
          <a href="/" class="rounded-lg px-3 py-2 transition {{ 'bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white' if request.url.path == '/' else 'text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white' }}">Resumen</a>
          <a href="/balance" class="rounded-lg px-3 py-2 transition {{ 'bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white' if request.url.path.startswith('/balance') else 'text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white' }}">Balance</a>
          <a href="/expenses" class="rounded-lg px-3 py-2 transition {{ 'bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white' if request.url.path.startswith('/expenses') else 'text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white' }}">Gastos</a>
          <a href="/incomes" class="rounded-lg px-3 py-2 transition {{ 'bg-slate-100 text-slate-900 dark:bg-slate-800 dark:text-white' if request.url.path.startswith('/incomes') else 'text-slate-600 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white' }}">Ingresos</a>
          <button type="button" id="theme-toggle"
                  class="ml-1 rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
                  aria-label="Cambiar tema" title="Cambiar tema">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden h-5 w-5 dark:block">
              <circle cx="12" cy="12" r="4" />
              <path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5 dark:hidden">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
          </button>
          <a href="/expenses/new" class="btn btn-primary ml-1">Agregar gasto</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
      <div class="mx-auto max-w-5xl px-4 py-4 text-xs text-slate-500 dark:text-slate-400">
        {{ app_name }} · Gastos personales · Moneda base: {{ base_currency }}
      </div>
    </footer>
  </div>

  <script>
    (() => {
      const toggle = document.getElementById("theme-toggle");

      const updateLabel = () => {
        const isDark = document.documentElement.classList.contains("dark");
        const label = isDark ? "Cambiar a tema claro" : "Cambiar a tema oscuro";
        toggle?.setAttribute("aria-label", label);
        toggle?.setAttribute("title", label);
      };

      updateLabel();

      toggle?.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("dark");
        try {
          localStorage.setItem("theme", isDark ? "dark" : "light");
        } catch {
          // Storage can be unavailable (private mode); the toggle still works for this page.
        }
        updateLabel();
      });
    })();
  </script>
</body>
</html>
