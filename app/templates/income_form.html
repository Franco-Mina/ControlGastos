{% extends "base.html" %}
{% block title %}Agregar ingreso · {{ app_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl">
  <a href="/incomes" class="text-sm text-slate-500 transition hover:text-slate-800">← Volver a ingresos</a>

  <div class="card mt-3 p-6">
    <h1 class="text-xl font-semibold tracking-tight text-slate-900">Agregar un ingreso</h1>
    <p class="mt-1 text-sm text-slate-500">Registra un ingreso para calcular tu balance.</p>

    {% if error %}
      <div class="mt-5 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/incomes" class="mt-6 space-y-5">
      <div class="grid gap-5 sm:grid-cols-2">
        <label class="block">
          <span class="mb-1 block text-sm font-medium text-slate-700">Fecha</span>
          <input type="date" name="received_on" required
                 value="{{ form.get('received_on') or today }}" class="field">
        </label>

        <label class="block">
          <span class="mb-1 block text-sm font-medium text-slate-700">Monto ({{ currency }})</span>
          <input type="text" name="amount" required inputmode="decimal" autocomplete="off"
                 placeholder="0.00" value="{{ form.get('amount', '') }}" class="field">
        </label>
      </div>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-slate-700">Descripción</span>
        <input type="text" name="description" required maxlength="200" autocomplete="off"
               placeholder="Sueldo de octubre, venta, reembolso…"
               value="{{ form.get('description', '') }}" class="field">
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-slate-700">Fuente <span class="font-normal text-slate-400">(opcional)</span></span>
        <input type="text" name="source" maxlength="80" autocomplete="off"
               placeholder="Sueldo, freelance, venta…"
               value="{{ form.get('source', '') }}" class="field">
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-slate-700">Notas <span class="font-normal text-slate-400">(opcional)</span></span>
        <textarea name="notes" rows="3" placeholder="Algo que valga la pena recordar…" class="field">{{ form.get('notes', '') }}</textarea>
      </label>

      <div class="flex items-center justify-end gap-3 border-t border-slate-100 pt-5">
        <a href="/incomes" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar ingreso</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
